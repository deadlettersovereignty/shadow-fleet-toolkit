[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "shadow-fleet-toolkit"
version = "0.2.0"
description = "OSINT pipeline for monitoring sanctioned and sanctions-evading tanker traffic"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["ais", "osint", "sanctions", "maritime", "shipping", "shadow-fleet"]
authors = [{ name = "shadow-fleet-toolkit contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Security",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
live = ["websockets>=12.0"]
nmea = ["pyais>=2.6"]
all  = ["websockets>=12.0", "pyais>=2.6"]
dev  = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/USERNAME/shadow-fleet-toolkit"
Issues = "https://github.com/USERNAME/shadow-fleet-toolkit/issues"

[project.scripts]
shadowfleet = "shadowfleet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shadowfleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.coverage.run]
source = ["shadowfleet"]
